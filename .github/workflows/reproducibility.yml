name: Reproducibility checks

on:
  push:
  pull_request:

jobs:
  quick-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Import and model checks
        env:
          MPLBACKEND: Agg
        run: |
          python tests/test_release_imports.py
          python tests/test_part2_consistency.py
          python tests/test_published_results.py
      - name: Quick reproduction
        env:
          MPLBACKEND: Agg
        run: python -m dpc_mud reproduce --quick --output-dir results/generated/ci
      - name: Privacy audit
        run: python tools/audit_release.py --root . --report PRIVACY_AUDIT_CI.md
